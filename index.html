<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man Tactical Interface</title>
    <link rel="stylesheet" href="style.css">
    <!-- Estilos de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <!-- Consola Normal (Tu PC) -->
    <div class="console-container" id="main-console">
        <div class="top-screen">
            <div id="map"></div>
            
            <div class="notification-banner" id="banner-status">
                TACTICAL FEED<br>AWAITING SIGNAL...
            </div>
        </div>

        <div class="bottom-panel">
            <button class="btn btn-green" onclick="cambiarAlerta('A.1')">A.1</button>
            <button class="btn btn-green" onclick="cambiarPerfil(1)">PROF 1</button>
            <button class="btn btn-blue" onclick="obtenerUbicacionActual()">MY LOC</button>
            <button class="btn" onclick="abrirChat()">CHAT</button>

            <button class="btn btn-red" onclick="cambiarAlerta('A.2')">A.2</button>
            <button class="btn btn-green" onclick="cambiarPerfil(2)">PROF 2</button>
            <button class="btn btn-red" onclick="accionRastrearObjetivo()">RASTREAR</button>
            <button class="btn" onclick="verArchivo()">ARCHIVE</button>

            <div></div>
            <button class="btn btn-green" onclick="cambiarPerfil(3)">PROF 3</button>
            <button class="btn" onclick="centrarEnMiUbicacion()">CENTER</button>
            <button class="btn" onclick="compartirEnlace()">SHARE LINK</button>
        </div>
    </div>

    <!-- Pantalla trampa sigilosa (Lo que ve la víctima por un segundo antes de que se cierre/limpie) -->
    <div id="stealth-screen" style="display: none; background: #000; color: #0ff; height: 100vh; width: 100vw; position: fixed; top: 0; left: 0; z-index: 9999; justify-content: center; align-items: center; font-family: monospace;">
        <div style="text-align: center;">
            <h2>Cargando recurso...</h2>
            <p>Por favor espere un momento.</p>
        </div>
    </div>

    <!-- Scripts de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js" type="module"></script>
</body>
</html>
