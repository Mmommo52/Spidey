<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man Tactical Interface</title>
    
    <!-- Estilos de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Tu archivo de estilos CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tactical-container">
        <!-- Contenedor del feed/mapa exactamente como lo diseñaste -->
        <div class="feed-box">
            <div id="map"></div>
        </div>

        <!-- Panel de control con tus botones -->
        <div class="control-panel">
            <!-- Aquí van tus botones, asegurando el ID para el botón SYS.CHECK -->
            <button id="sysCheckBtn" class="btn-sys">SYS.CHECK</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    
    <!-- Tu script principal -->
    <script src="script.js"></script>
</body>
</html>
