<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider-Man Tactical Interface</title>
    <link rel="stylesheet" href="style.css">
    <!-- Estilos de Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>

    <div class="console-outer-frame">
        <!-- Pestañas/Iconos laterales izquierdos estilo consola portátil -->
        <div class="side-tabs">
            <div class="side-tab">O</div>
            <div class="side-tab">S</div>
            <div class="side-tab">T</div>
            <div class="side-tab spider-avatar-tab">🕷️</div>
            <div class="side-tab mini-avatar-tab">👤</div>
        </div>

        <div class="console-container">
            <!-- Cabecera Superior con la Máscara y Temporizadores -->
            <div class="top-header-bar">
                <div class="timer-box">00:00</div>
                <div class="spidey-mask-icon">🕷️</div>
                <div class="timer-box">00:00</div>
            </div>

            <!-- Pantalla Superior: Mapa -->
            <div class="top-screen">
                <div id="map"></div>
                
                <div class="notification-banner" id="banner-status">
                    NEW SIGHTING<br>LOCATION: FOUND!
                </div>
            </div>

            <!-- Panel de Control Inferior -->
            <div class="bottom-panel">
                <!-- Columna 1 -->
                <div class="btn-col">
                    <button class="btn btn-green" onclick="cambiarAlerta('A.1')">A.1</button>
                    <button class="btn btn-red" onclick="cambiarAlerta('A.2')">A.2</button>
                </div>
                <!-- Columna 2 -->
                <div class="btn-col">
                    <button class="btn btn-green" onclick="cambiarPerfil(1)">PROF 1</button>
                    <button class="btn btn-green" onclick="cambiarPerfil(2)">PROF 2</button>
                    <button class="btn btn-green" onclick="cambiarPerfil(3)">PROF 3</button>
                </div>
                <!-- Columna 3 -->
                <div class="btn-col">
                    <button class="btn btn-orange" onclick="accionTerrain()">TERRAIN</button>
                    <button class="btn btn-blue" onclick="accion3DView()">3D VIEW</button>
                    <button class="btn btn-orange" onclick="centrarUbicacion()">CENTER LOC</button>
                </div>
                <!-- Columna 4 -->
                <div class="btn-col">
                    <button class="btn btn-orange" onclick="abrirChat()">CHAT</button>
                    <button class="btn btn-orange" onclick="verArchivo()">ARCHIVE</button>
                    <button class="btn btn-orange" onclick="compartirEnlace()">SHARE</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts de Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Script principal con Firebase integrado -->
    <script src="script.js" type="module"></script>
</body>
</html>
