<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spidey Console</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- MODO VÍCTIMA (Pantalla de carga / sigilosa) -->
    <div id="stealth-screen" style="display: none;">
        <div class="loader-content">
            <h2>Cargando recurso...</h2>
            <p>Por favor espera un momento.</p>
        </div>
    </div>

    <!-- MODO CONSOLA PRINCIPAL (Tu interfaz táctica) -->
    <div id="main-console">
        <div class="console-container">
            <!-- Banner de estado -->
            <div id="banner-status" class="banner">INICIALIZANDO SISTEMA...</div>

            <!-- Contenedor del Mapa (Obligatorio con altura fija en CSS) -->
            <div id="map"></div>

            <!-- Botonera de control -->
            <div class="button-grid">
                <button onclick="cambiarAlerta('A1')">A.1</button>
                <button onclick="cambiarPerfil('PROF 1')">PROF 1</button>
                <button onclick="obtenerUbicacionActual()">MY LOC</button>
                <button onclick="abrirChat()">CHAT</button>
                
                <button onclick="cambiarAlerta('A2')">A.2</button>
                <button onclick="cambiarPerfil('PROF 2')">PROF 2</button>
                <button onclick="accionRastrearObjetivo()">RASTREAR</button>
                <button onclick="verArchivo()">ARCHIVE</button>
                
                <button onclick="cambiarPerfil('PROF 3')">PROF 3</button>
                <button onclick="centrarEnMiUbicacion()">CENTER</button>
                <button onclick="compartirEnlace()">SHARE LINK</button>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Script principal como Módulo -->
    <script type="module" src="script.js"></script>
</body>
</html>
